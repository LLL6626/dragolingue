<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#F6F4EE;font-family:"Inter",system-ui,sans-serif;color:#1F2A33;padding:22px;width:900px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:18px;margin:18px 0 10px} p.sub{margin:0 0 6px;color:#66727C}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:#fff;border:2px solid #E2DDD0;border-radius:16px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.card svg.big{width:84px;height:84px}
.card b{font-size:15px}.card span{font-size:12.5px;color:#66727C;text-align:center;line-height:1.3}
.mini{display:flex;align-items:center;gap:6px;font-weight:800;font-size:17px;background:#F6F4EE;border-radius:10px;padding:4px 10px}.mini svg{width:24px;height:24px}
.dark{background:#13202A;color:#EEF2F4}
</style></head><body>
<h1>Huellas y escamas</h1><p class="sub">Cada una en grande, a tamaño de la barra de arriba y en modo oscuro.</p>
<h2>Huellas (racha)</h2><div class="grid" id="h"></div>
<h2>Escamas (puntos)</h2><div class="grid" id="e"></div>
<script src="iconos3.js"></script>
<script>
const big = s => s.replace('<svg ', '<svg class="big" ');
const card = (svg, t, d, n) => `<div class="card">${big(svg)}<b>${t}</b><span>${d}</span><div style="display:flex;gap:6px"><span class="mini">${svg}${n}</span><span class="mini dark">${svg}${n}</span></div></div>`;
document.getElementById('h').innerHTML = [
  [H.h1, 'H1 · Garras', 'Tres dedos en punta y talón'],
  [H.h2, 'H2 · Pisadas', 'Dos huellas en diagonal: la racha avanza'],
  [H.h3, 'H3 · Pata gordita', 'Como la pata de la mascota, garras blancas'],
  [H.h4, 'H4 · Garras de oro', 'La H1 con las puntas doradas'],
].map(([s, t, d]) => card(s, t, d, 7)).join('');
document.getElementById('e').innerHTML = [
  [E.e1, 'E1 · Con nervio', 'Dorada, borde rojo y nervio central'],
  [E.e3, 'E3 · Señera', 'La misma forma con las barras de Aragón'],
  [E.e5, 'E5 · Piel de dragón', 'Círculo con filas de escamas'],
  [E.e6, 'E6 · Abanico', 'Escama ancha con estrías'],
].map(([s, t, d]) => card(s, t, d, 120)).join('');
</script></body></html>
