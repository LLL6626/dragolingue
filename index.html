<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dragolingüe · Aprende aragonés</title>
<meta name="description" content="Aprende aragonés con Dragolingüe.">
<meta name="theme-color" content="#F6F4EE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="web/icon-192.png">
<link rel="apple-touch-icon" href="web/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dragolingüe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: columna de móvil centrada; mapa en zigzag por unidades temáticas; lección a pantalla completa con barra de comprobación fija abajo */
:root{
  --bg:#F6F4EE; --surface:#FFFFFF; --ink:#1F2A33; --muted:#66727C; --line:#E2DDD0;
  --oro:#F2B200; --oro-soft:#FFF1C2; --rojo:#C8231B; --rojo-soft:#FBE3E0;
  --monte:#2F5D7C; --monte-soft:#E3EEF5; --ok:#3F9A2E; --ok-soft:#E5F4DF; --ko:#C8231B; --ko-soft:#FBE3E0;
  --locked:#C9C5BA; --shadow:rgba(31,42,51,.12);
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13202A; --surface:#1C2C38; --ink:#EEF2F4; --muted:#9AA9B3; --line:#2B3D4A;
  --oro:#FFC21A; --oro-soft:#3A3214; --rojo:#F0574C; --rojo-soft:#3E1F1E;
  --monte:#7DB3D6; --monte-soft:#1F3443; --ok:#7BCB62; --ok-soft:#1E3420; --ko:#F0574C; --ko-soft:#3E1F1E;
  --locked:#3A4A55; --shadow:rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13202A; --surface:#1C2C38; --ink:#EEF2F4; --muted:#9AA9B3; --line:#2B3D4A;
  --oro:#FFC21A; --oro-soft:#3A3214; --rojo:#F0574C; --rojo-soft:#3E1F1E;
  --monte:#7DB3D6; --monte-soft:#1F3443; --ok:#7BCB62; --ok-soft:#1E3420; --ko:#F0574C; --ko-soft:#3E1F1E;
  --locked:#3A4A55; --shadow:rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--monte);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}

/* barra superior */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:var(--rojo);background:none;border:none;padding:0}
.brand img{width:34px;height:34px;display:block}

/* bienvenida y «Sobre el aragonés» */
.app.welcome-app{padding-left:0;padding-right:0}
.welcome{flex:1;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.cover{position:relative;background:linear-gradient(to bottom,#E3F2F6,rgb(168,214,227));padding-top:calc(56px + env(safe-area-inset-top,0px))}
.cover img{display:block;width:100%;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 12%);mask-image:linear-gradient(to bottom,transparent,#000 12%)}
.cover::after{content:"";position:absolute;inset:auto 0 0 0;height:24%;background:linear-gradient(to bottom,rgba(246,244,238,0),var(--bg))}
.logo-pill{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;white-space:nowrap;
  background:rgba(255,255,255,.92);padding:5px 14px 5px 5px;border-radius:99px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--rojo);box-shadow:0 4px 14px rgba(0,0,0,.12)}
.logo-pill img{width:34px;height:34px}
.welcome-bottom{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;
  margin-top:-28px;padding:0 20px calc(24px + env(safe-area-inset-bottom,0px))}
.say{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;width:100%;max-width:360px}
.say::before{content:"";position:absolute;left:50%;top:-10px;width:16px;height:16px;margin-left:-8px;background:var(--surface);border-left:2px solid var(--line);border-top:2px solid var(--line);transform:rotate(45deg)}
.say .ar{font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--monte)}
.say .es{color:var(--muted);font-weight:700;margin-top:2px}
.welcome-btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px;margin-top:4px}
.about{flex:1;display:flex;flex-direction:column;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.about-top{display:flex;align-items:center;gap:12px;padding-block:14px}
.dots{flex:1;display:flex;justify-content:center;gap:6px}
.langs{display:flex;gap:6px}
.lang{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid transparent;background:none;display:grid;place-items:center;opacity:.5;transition:opacity .15s}
.lang svg{width:26px;height:26px;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.lang[aria-pressed="true"]{opacity:1;border-color:var(--monte)}
.lang[aria-pressed="true"] svg{width:24px;height:24px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--rojo);width:22px;border-radius:99px}
.about-card{flex:1;display:flex;flex-direction:column;gap:14px}
.about-pic{position:relative;border-radius:22px;aspect-ratio:5/3;perspective:1200px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.about-pic.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--monte-soft)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.back{transform:rotateY(180deg)}
.where{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.92);color:var(--monte);font-weight:800;font-size:.78rem;padding:5px 10px;border-radius:99px;display:flex;gap:6px;align-items:center}
.sign{position:absolute;right:14px;bottom:14px;background:#F6E2B3;border:3px solid #8C6A3C;border-radius:10px;padding:6px 14px;transform:rotate(-4deg);
  font-family:var(--f-display);font-weight:800;font-size:1.25rem;color:#5A3A1A;text-align:center;line-height:1.1;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.sign small{display:block;font-family:var(--f-body, inherit);font-size:.72rem;font-weight:700;color:#8C6A3C}
.about-pic .dr{width:58%}
.about-card h1{font-size:1.7rem;color:var(--rojo)}
.about-card .talk{display:flex;gap:10px;align-items:flex-start}
.about-card .talk .mini{width:54px;flex:none}
.about-card .talk p{margin:0;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:1.05rem;line-height:1.45}
.about-card .src{font-size:.78rem;color:var(--muted);margin:0}
.about-nav{display:flex;gap:12px;margin-top:18px}
.about-nav .big-btn{flex:1}
.stats{display:flex;gap:12px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;font-variant-numeric:tabular-nums}
.stat svg{width:22px;height:22px}

/* mapa */
.view{flex:1;padding-bottom:96px}
.section-label{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 8px}
.unit{margin-bottom:8px}
.unit-head{border-radius:18px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;background:var(--rojo)}
.unit-head.locked{background:var(--locked);color:var(--surface)}
.unit-head .num{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.unit-head h2{font-size:1.35rem;margin-top:2px}
.unit-head .theme{font-size:.85rem;opacity:.95}
.tip-btn{flex:none;border:2px solid rgba(255,255,255,.7);background:transparent;color:inherit;border-radius:12px;padding:8px 10px;font-weight:800;font-size:.85rem;display:flex;gap:6px;align-items:center}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:30px;padding-block:28px 20px}
.stop{position:relative;display:flex;flex-direction:column;align-items:center}
.stop.has-bubble{margin-top:34px}
.node{width:72px;height:66px;border-radius:50%;border:none;position:relative;display:grid;place-items:center;
  background:var(--locked);box-shadow:0 7px 0 rgba(0,0,0,.18);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.node svg{width:32px;height:32px}
.node.done{background:var(--oro)}
.node.current{background:var(--rojo)}
.node.current::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:4px solid var(--rojo);opacity:.35;animation:pulse 1.8s infinite}
@keyframes pulse{50%{transform:scale(1.08);opacity:.1}}
.node.locked{cursor:not-allowed}
.node-label{margin-top:14px;font-size:.8rem;font-weight:800;color:var(--muted);white-space:nowrap;line-height:1.2}
.start-bubble{position:absolute;bottom:100%;margin-bottom:10px;background:var(--surface);color:var(--rojo);border:2px solid var(--line);border-radius:12px;padding:4px 10px;font-weight:800;font-size:.85rem;white-space:nowrap}
.mascot-on-path{position:absolute;width:118px;pointer-events:none}
.locked-note{font-size:.88rem;color:var(--muted);padding:12px 4px 4px;text-align:center}

/* nav inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);
  padding:6px max(16px, env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.tabbar-inner{max-width:480px;margin:0 auto;display:flex;justify-content:space-around}
.tab{border:2px solid transparent;background:none;border-radius:12px;padding:6px 14px;display:flex;flex-direction:column;align-items:center;font-size:.75rem;font-weight:800;color:var(--muted)}
.tab svg{width:26px;height:26px}
.tab[aria-selected="true"]{color:var(--monte);border-color:var(--monte-soft);background:var(--monte-soft)}

/* vocabulario y perfil */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.vocab-list{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:10px}
.vocab-list .ar{font-weight:800}
.vocab-list .es{color:var(--muted)}
.profile-head{display:flex;gap:12px;align-items:center}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.metric{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.metric b{display:block;font-family:var(--f-display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.metric span{font-size:.78rem;color:var(--muted);font-weight:700}
.link-btn{background:none;border:none;color:var(--monte);font-weight:800;text-decoration:underline;padding:0}

/* lección */
.lesson{display:flex;flex-direction:column;min-height:100%;padding-bottom:150px}
.lesson-top{display:flex;align-items:center;gap:12px;padding-block:14px}
.icon-btn{background:none;border:none;padding:4px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:26px;height:26px}
.progress{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.hearts{display:flex;align-items:center;gap:4px;font-weight:800;color:var(--rojo);font-variant-numeric:tabular-nums}
.hearts svg{width:24px;height:24px}
.q-kind{font-size:.78rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--monte);margin:10px 0 6px}
.q-title{font-size:1.5rem;margin-bottom:14px}
.coach{display:flex;align-items:flex-end;gap:10px;margin-bottom:18px}
.coach .mini{width:84px;flex:none}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:800;font-size:1.15rem;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;width:16px;height:16px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble .es-hint{display:block;font-weight:600;font-size:.85rem;color:var(--muted);margin-top:2px}
.audio{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;border:2px dashed var(--line);background:none;color:var(--muted);vertical-align:middle;margin-right:6px}
.audio svg{width:18px;height:18px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card,.opt,.tile,.mbtn{border:2px solid var(--line);background:var(--surface);border-radius:16px;box-shadow:0 4px 0 var(--line);font-weight:800}
.card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;font-size:1rem}
.card .pic{font-size:2.6rem;line-height:1}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;font-size:1.05rem}
.selected{border-color:var(--monte)!important;background:var(--monte-soft)!important;box-shadow:0 4px 0 var(--monte)!important}
.answer-line{min-height:62px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px;border-top:2px solid var(--line)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:8px 14px;font-size:1.05rem}
.tile.ghost{visibility:hidden}
.fill-sentence{font-family:var(--f-display);font-size:1.6rem;font-weight:700;margin-bottom:6px}
.fill-sentence .gap{display:inline-block;min-width:96px;border-bottom:3px solid var(--monte);text-align:center;color:var(--monte)}
.fill-es{color:var(--muted);margin-bottom:20px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-col{display:flex;flex-direction:column;gap:10px}
.mbtn{padding:12px 8px;font-size:1rem}
.mbtn.gone{opacity:.35;box-shadow:none;cursor:default}
.mbtn.bad{border-color:var(--ko);background:var(--ko-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.checkbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:2px solid var(--line);
  padding:14px max(16px, env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.checkbar.ok{background:var(--ok-soft);border-color:transparent}
.checkbar.ko{background:var(--ko-soft);border-color:transparent}
.checkbar-inner{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb{display:flex;align-items:center;gap:10px}
.fb .mini{width:58px;flex:none}
.fb h3{font-size:1.3rem}
.checkbar.ok .fb h3{color:var(--ok)} .checkbar.ko .fb h3{color:var(--ko)}
.fb p{margin:2px 0 0;font-weight:700}
.big-btn{width:100%;border:none;border-radius:16px;padding:14px;font-weight:800;font-size:1.05rem;letter-spacing:.04em;text-transform:uppercase;
  background:var(--ok);color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.big-btn:disabled{background:var(--line);color:var(--muted);box-shadow:none;cursor:not-allowed}
.big-btn.red{background:var(--ko)}
.big-btn.secondary{background:var(--surface);color:var(--monte);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}

/* fin de lección */
.finish{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:24px;padding-bottom:160px}
.finish .hero-dragon{width:220px;max-width:70%}
.finish h1{font-size:2rem;color:var(--rojo)}
.finish-stats{display:flex;gap:10px;width:100%}
.finish-stats .metric{flex:1}

/* modal consejos */
.sheet-back{position:fixed;inset:0;z-index:20;background:rgba(10,20,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:85%;overflow:auto;border-radius:22px 22px 0 0;
  padding:20px max(16px, env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet h2{color:var(--rojo);font-size:1.5rem}
.sheet table{border-collapse:collapse;width:100%;margin:10px 0}
.sheet td{border-bottom:1px solid var(--line);padding:6px 4px}
.sheet td:first-child{font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90%}
.proto-note{font-size:.8rem;color:var(--muted);text-align:center;margin-top:20px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app"></div>


<script>
/* ---------- Dragolingüe (SVG) ---------- */
let dragonId = 0;
function dragon(mood = "happy") {
  const id = "d" + (++dragonId);
  const wingL = mood === "cheer" ? "rotate(14 66 120)" : mood === "sad" ? "rotate(-10 66 120)" : "";
  const wingR = mood === "cheer" ? "rotate(-14 134 120)" : mood === "sad" ? "rotate(10 134 120)" : "";
  const mouth = {
    happy: '<path d="M90 103 Q100 112 110 103" fill="none" stroke="#6E1612" stroke-width="3" stroke-linecap="round"/>',
    cheer: '<path d="M88 101 Q100 118 112 101 Z" fill="#6E1612"/><path d="M93 107 Q100 112 107 107" fill="#F07A86"/>',
    sad: '<path d="M90 108 Q100 101 110 108" fill="none" stroke="#6E1612" stroke-width="3" stroke-linecap="round"/>',
    think: '<path d="M93 105 L108 103" fill="none" stroke="#6E1612" stroke-width="3" stroke-linecap="round"/>'
  }[mood];
  const look = mood === "think" ? -3 : 0;
  const brows = mood === "sad" ? '<path d="M74 58 L92 63 M126 58 L108 63" stroke="#7A1A15" stroke-width="3" stroke-linecap="round"/>' : "";
  const wing = `M66 122 C34 102 12 78 14 50 C25 60 35 64 45 62 C41 74 46 84 57 88 C51 98 56 108 66 114 Z`;
  return `<svg viewBox="-18 0 236 200" role="img" aria-label="Dragolingüe">
  <defs><clipPath id="${id}c"><path d="${wing}"/></clipPath></defs>

let SECTIONS = [], UNITS = [], PRAISE = ["¡Muito bien!"];
function adoptContent(d) {
  UNITS = d.unidades.map(U => ({
    id: U.id, title: U.titulo, theme: U.tema, locked: !!U.bloqueada,
    tip: U.consejo && { title: U.consejo.titulo, html: U.consejo.html },
    vocab: (U.vocabulario || []).map(v => [v.ar, v.es]),
    lessons: (U.lecciones || []).map(L => ({ id: L.id, name: L.nombre, review: !!L.repaso, ex: L.ejercicios || [] }))
  }));
  const idx = id => UNITS.findIndex(u => u.id === id);
  SECTIONS = d.secciones.map(x => ({ name: x.nombre, units: x.unidades.map(idx).filter(i => i >= 0) }));
  if (d.felicitaciones && d.felicitaciones.length) PRAISE = d.felicitaciones;
}

/* ---------- Estado ---------- */
const KEY = "dragolingue-v2";
let S = load();
function load() {
  const base = { done: {}, xp: 0, streak: 0, lastDay: null, unlockAll: false };
  try { return Object.assign(base, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { return base; }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const lk = (u, l) => UNITS[u].lessons[l].id;
function isDone(u, l) { return !!S.done[lk(u, l)]; }
function currentLesson() {
  for (let u = 0; u < UNITS.length; u++) {
    if (UNITS[u].locked) return null;
    for (let l = 0; l < UNITS[u].lessons.length; l++) if (!isDone(u, l)) return [u, l];
  }
  return null;
}
function isOpen(u, l) {
  if (UNITS[u].locked) return false;
  if (S.unlockAll || isDone(u, l)) return true;
  const c = currentLesson(); return c && c[0] === u && c[1] === l;
}
let tab = "learn";

/* ---------- Utilidades ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => s.toLowerCase().replace(/[¿?¡!.,]/g, "").replace(/\s+/g, " ").trim();
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}
function today() { return new Date().toISOString().slice(0, 10); }

  const cur = $app.querySelector(".node.current"); if (cur && tab === "learn") setTimeout(() => cur.scrollIntoView({ block: "center", behavior: "smooth" }), 60);

function learnView() {

function openTip(u) {

/* ---------- Lección ---------- */
let L = null;
function startLesson(u, l) {
  const lesson = UNITS[u].lessons[l];
  let ex = lesson.review
    ? shuffle(UNITS[u].lessons.filter(x => !x.review).flatMap(x => x.ex)).slice(0, 8)
    : lesson.ex.slice();
  L = { u, l, queue: ex, total: ex.length, i: 0, hearts: 5, right: 0, firstTry: 0, missed: new Set(), state: null };
  renderEx();
}
function lessonTop() {
  const pct = Math.round(L.right / L.total * 100);
  return `<div class="lesson-top">
    <button class="icon-btn" id="quit" aria-label="Salir de la lección">${ICON.close}</button>
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <span class="hearts" aria-label="Vidas">${ICON.heart}${L.hearts}</span></div>`;
}
const audioBtn = `<button class="audio" title="Audio pendiente: se grabará con hablantes" aria-label="Audio pendiente de grabar">${ICON.speaker}</button>`;
function renderEx() {
  const ex = L.queue[L.i];
  L.state = { ex, sel: null, built: [], matched: 0 };
  let body = "";
  if (ex.t === "pick") {
    body = `<p class="q-kind">Nueva palabra</p><h1 class="q-title">¿Cómo se dice «${esc(ex.es)}»?</h1>
      <div class="cards">${shuffle(ex.options).map(([w, p]) => `<button class="card" data-v="${esc(w)}"><span class="pic" aria-hidden="true">${p}</span>${esc(w)}</button>`).join("")}</div>`;
  } else if (ex.t === "choice") {
    body = `<p class="q-kind">Traduce</p>
      <div class="coach"><div class="mini">${dragon("happy")}</div><div class="bubble">${audioBtn}${esc(ex.ar)}</div></div>
      <div class="opts">${ex.options.map((o, i) => `<button class="opt" data-v="${i}">${esc(o)}</button>`).join("")}</div>`;
  } else if (ex.t === "build") {
    body = `<p class="q-kind">Escribe en aragonés</p>
      <div class="coach"><div class="mini">${dragon("think")}</div><div class="bubble">${esc(ex.es)}</div></div>
      <div class="answer-line" id="line"></div>
      <div class="bank" id="bank">${shuffle(ex.tiles.map((w, i) => [w, i])).map(([w, i]) => `<button class="tile" data-i="${i}">${esc(w)}</button>`).join("")}</div>`;
  } else if (ex.t === "fill") {
    body = `<p class="q-kind">Completa la frase</p>
      <p class="fill-sentence">${esc(ex.before)} <span class="gap" id="gap">&nbsp;</span> ${esc(ex.after)}</p>
      <p class="fill-es">${esc(ex.es)}</p>
      <div class="opts">${shuffle(ex.options).map(o => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  } else if (ex.t === "match") {
    body = `<p class="q-kind">Une las parejas</p><h1 class="q-title">Aragonés y castellano</h1>
      <div class="match"><div class="match-col">${shuffle(ex.pairs.map((p, i) => [p[0], i])).map(([w, i]) => `<button class="mbtn" data-side="a" data-i="${i}">${esc(w)}</button>`).join("")}</div>
      <div class="match-col">${shuffle(ex.pairs.map((p, i) => [p[1], i])).map(([w, i]) => `<button class="mbtn" data-side="b" data-i="${i}">${esc(w)}</button>`).join("")}</div></div>`;
  }
  $app.className = "app lesson";
  $app.innerHTML = lessonTop() + `<main>${body}</main>` +
    `<div class="checkbar" id="bar"><div class="checkbar-inner"><button class="big-btn" id="check" disabled>Comprobar</button></div></div>`;
  $app.querySelector("#quit").onclick = () => { L = null; renderHome(); };
  $app.querySelectorAll(".audio").forEach(b => b.onclick = () => toast("El audio se grabará con hablantes nativos."));
  wire(ex);
  window.scrollTo(0, 0);
}
function setReady(v) { const c = $app.querySelector("#check"); if (c) c.disabled = !v; }
function wire(ex) {
  const st = L.state;
  if (ex.t === "pick" || ex.t === "choice" || ex.t === "fill") {
    const sel = ex.t === "pick" ? ".card" : ".opt";
    $app.querySelectorAll(sel).forEach(b => b.onclick = () => {
      if (st.locked) return;
      $app.querySelectorAll(sel).forEach(x => x.classList.remove("selected"));
      b.classList.add("selected"); st.sel = b.dataset.v;
      if (ex.t === "fill") $app.querySelector("#gap").textContent = st.sel;
      setReady(true);
    });
  }
  if (ex.t === "build") {
    const line = $app.querySelector("#line");
    $app.querySelectorAll("#bank .tile").forEach(b => b.onclick = () => {
      if (st.locked || b.classList.contains("ghost")) return;
      b.classList.add("ghost"); st.built.push(+b.dataset.i);
      const t = document.createElement("button"); t.className = "tile"; t.textContent = b.textContent;
      t.onclick = () => { if (st.locked) return; t.remove(); b.classList.remove("ghost"); st.built.splice(st.built.indexOf(+b.dataset.i), 1); setReady(st.built.length > 0); };
      line.appendChild(t); setReady(true);
    });
  }
  if (ex.t === "match") {
    let pick = null;
    $app.querySelectorAll(".mbtn").forEach(b => b.onclick = () => {
      if (b.classList.contains("gone")) return;
      if (!pick || pick.dataset.side === b.dataset.side) {
        if (pick) pick.classList.remove("selected");
        pick = b; b.classList.add("selected"); return;
      }
      if (pick.dataset.i === b.dataset.i) {
        [pick, b].forEach(x => { x.classList.remove("selected"); x.classList.add("gone"); x.disabled = true; });
        st.matched++; pick = null;
        if (st.matched === ex.pairs.length) { st.sel = "ok"; resolve(true); }
      } else {
        const a = pick; [a, b].forEach(x => { x.classList.remove("selected"); x.classList.add("bad"); });
        setTimeout(() => [a, b].forEach(x => x.classList.remove("bad")), 400);
        pick = null; st.matchErr = true;
      }
    });
  }
  const c = $app.querySelector("#check");
  if (c) c.onclick = () => {
    let ok = false, correct = "";
    if (ex.t === "pick") { ok = st.sel === ex.answer; correct = ex.answer; }
    if (ex.t === "choice") { ok = +st.sel === ex.answer; correct = ex.options[ex.answer]; }
    if (ex.t === "fill") { ok = st.sel === ex.answer; correct = `${ex.before} ${ex.answer} ${ex.after}`; }
    if (ex.t === "build") { ok = norm(st.built.map(i => ex.tiles[i]).join(" ")) === norm(ex.answer); correct = ex.answer; }
    resolve(ok, correct);
  };
}
function resolve(ok, correct) {
  const st = L.state; st.locked = true;
  const ex = st.ex;
  if (ok) { L.right++; if (!L.missed.has(ex) && !st.matchErr) L.firstTry++; }
  else { L.hearts--; L.missed.add(ex); L.queue.push(ex); }
  const bar = $app.querySelector("#bar");
  const out = L.hearts <= 0;
  sfx(ok ? "ok" : "ko");
  bar.className = "checkbar " + (ok ? "ok" : "ko");
  bar.innerHTML = `<div class="checkbar-inner"><div class="fb"><div class="mini">${dragon(ok ? "cheer" : "sad")}</div>
    <div>${ok ? `<h3>${PRAISE[Math.floor(Math.random() * PRAISE.length)]}</h3>` :
      `<h3>${out ? "Te has quedado sin vidas" : "Casi lo tienes"}</h3><p>Respuesta correcta: ${esc(correct)}</p>`}</div></div>
    <button class="big-btn ${ok ? "" : "red"}" id="next">${out ? "Volver al mapa" : "Continuar"}</button></div>`;
  const prog = $app.querySelector(".progress i"); if (prog) prog.style.width = Math.round(L.right / L.total * 100) + "%";
  const hearts = $app.querySelector(".hearts"); if (hearts) hearts.innerHTML = ICON.heart + L.hearts;
  const next = $app.querySelector("#next"); next.focus();
  next.onclick = () => {
    if (out) { L = null; renderHome(); toast("Repasa los consejos de la unidad y vuelve a intentarlo."); return; }
    L.i++;
    if (L.i >= L.queue.length) finishLesson(); else renderEx();
  };
}
function finishLesson() {
  const first = !isDone(L.u, L.l);
  const acc = Math.round(L.firstTry / L.total * 100);
  const xp = 10 + (acc === 100 ? 5 : 0);
  sfx("win");
  S.done[lk(L.u, L.l)] = true; S.xp += xp;
  const t = today();
  if (S.lastDay !== t) {
    const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
    S.streak = S.lastDay === y ? S.streak + 1 : 1; S.lastDay = t;
  }
  save();
  const lessonName = UNITS[L.u].lessons[L.l].name;
  $app.className = "app";
  $app.innerHTML = `<main class="finish"><div class="hero-dragon">${dragon("cheer")}</div>
    <h1>¡Lección completada!</h1><p style="margin:0;color:var(--muted);font-weight:700">${esc(lessonName)} · Unidad ${L.u + 1}</p>
    <div class="finish-stats">
      <div class="metric"><b>+${xp}</b><span>XP</span></div>
      <div class="metric"><b>${acc}%</b><span>a la primera</span></div>
      <div class="metric"><b>${S.streak}</b><span>días de racha</span></div>
    </div>
    <p style="margin:0">${first ? "Dragolingüe ha guardado tu progreso." : "Repaso hecho. ¡Muito bien!"}</p></main>
    <div class="checkbar"><div class="checkbar-inner"><button class="big-btn" id="cont">Continuar</button></div></div>`;
  L = null;
  $app.querySelector("#cont").onclick = () => { tab = "learn"; renderHome(); };
}

/* ---------- Sonidos (generados con el navegador, sin archivos) ---------- */
let actx = null;
function sfx(kind) {
  if (S.sound === false) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    const t0 = actx.currentTime + 0.02;
    const note = (freq, start, dur, type = "triangle", vol = 0.22, slideTo) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0 + start);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + start + dur);
      g.gain.setValueAtTime(0.0001, t0 + start);
      g.gain.exponentialRampToValueAtTime(vol, t0 + start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
      o.connect(g).connect(actx.destination); o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
    };
    if (kind === "ok") { note(784, 0, 0.12); note(1175, 0.09, 0.22); }                         // acierto: dos notas que suben
    if (kind === "ko") { note(220, 0, 0.32, "sawtooth", 0.09, 150); note(165, 0.12, 0.3, "square", 0.05, 120); } // fallo: zumbido grave
    if (kind === "win") { [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.11, i === 3 ? 0.5 : 0.16)); note(1319, 0.44, 0.5, "sine", 0.12); } // fanfarria
  } catch (e) { /* sin sonido si el navegador no lo permite */ }
}

/* ---------- Sobre el aragonés ----------
   Cada tarjeta puede llevar una imagen: pon en "img" la ruta (por ejemplo "web/img/ainsa.jpg") y en "place" el lugar.
   Mientras no haya imagen, se ve el dragón con el ánimo de "mood". */
const ABOUT = [
  { title: "¿Qué es el aragonés?", mood: "happy",
    text: "El aragonés es mi lengua: una lengua romance, hermana del castellano y del catalán, nacida del latín. Es la propia del norte de Aragón y viene del navarroaragonés que ya se hablaba en la Edad Media.",
    title_ar: "¿Qué ye l'aragonés?",
    text_ar: "L'aragonés ye la mía luenga: una luenga romance, chirmana de lo castellano y de lo catalán, naixida de lo latín. Ye la luenga propia de lo norte d'Aragón y vien de lo navarroaragonés que ya se charraba en la Edat Meya." },
  { title: "¿Dónde se habla?", mood: "think",
    text: "Sobre todo en los valles del Pirineo y en el Prepirineo de Huesca: Echo, Ansó, Panticosa, Bielsa, Chistau… Y cada vez más en ciudades como Zaragoza o Huesca, donde mucha gente lo aprende de nuevo.",
    title_ar: "¿Án se charra?",
    text_ar: "Sobre tot en las vals de lo Pirineo y en lo Prepirineo d'Uesca: Echo, Ansó, Panticosa, Bielsa, Chistau… Y cada vegada más en ciudaz como Zaragoza u Uesca, an que muita chent l'aprende de nuevo." },
  { title: "Muchas variedades", mood: "cheer",
    text: "Cada valle tiene su manera de hablarlo: el cheso en Echo, el patués en Benasque, el belsetán en Bielsa, el chistabín en Chistau… En esta app aprenderás el aragonés común, y te avisaré cuando una palabra se diga de otra forma.",
    title_ar: "Muitas variedaz",
    text_ar: "Cada val tiene la suya manera de charrar-lo: lo cheso en Echo, lo patués en Benasque, lo belsetán en Bielsa, lo chistabín en Chistau… En ista app aprendrás l'aragonés común, y te avisaré quan una parola se diga d'atra manera." },
  { title: "¿Cuánta gente lo habla?", mood: "think",
    text: "En el censo de 2011, unas 56.000 personas dijeron conocerlo y unas 25.000, hablarlo. Hoy se calcula que lo usan a diario entre 10.000 y 12.000 personas. Es una lengua minoritaria y en retroceso: ¡por eso te necesito!",
    src: "Fuentes: censo de 2011; Dirección General de Política Lingüística (2017).",
    title_ar: "¿Quánta chent lo charra?",
    text_ar: "En lo censo de 2011, bellas 56.000 personas dicioron que lo conoixeban y bellas 25.000, que lo charraban. Hue se calcula que lo emplegan cada día entre 10.000 y 12.000 personas. Ye una luenga minoritaria y en retroceso: ¡por ixo te necesito!",
    src_ar: "Fuents: censo de 2011; Dirección General de Política Lingüística (2017)." },
  { title: "Una lengua con norma", mood: "think",
    text: "Desde 2021 existe la Academia Aragonesa de la Lengua. En 2023 aprobó la ortografía oficial del aragonés, y fue la primera norma del Boletín Oficial de Aragón escrita en aragonés. Es la ortografía que usamos aquí.",
    title_ar: "Una luenga con norma",
    text_ar: "Dende 2021 existe l'Academia Aragonesa de la Lengua. En 2023 aprebó la ortografía oficial de l'aragonés, y estió la primera norma de lo Boletín Oficial d'Aragón escrita en aragonés. Ye la ortografía que emplegamos aquí." },
  { title: "¿Por qué aprenderlo?", mood: "cheer",
    text: "Porque es parte de Aragón: está en los nombres de los pueblos, de los montes y en muchas palabras de nuestros abuelos. Y si hablas castellano, te resultará muy fácil de entender. ¿Empezamos?",
    title_ar: "¿Por qué aprender-lo?",
    text_ar: "Porque ye parte d'Aragón: ye en los nombres de los lugars, de los monts y en muitas parolas de los nuestros lolos. Y si charras castellano, te será muito fácil d'entender. ¿Empecipiamos?" },
];
// Lugares donde aparece Dragolingüe. "ar" es el nombre en aragonés del cartel; "es", el castellano si cambia.
const PLACES = {
  ainsa: { ar: "L'Aínsa", es: "Aínsa" },
  huesca: { ar: "Uesca", es: "Huesca" },
  zaragoza: { ar: "Zaragoza" },
  albarracin: { ar: "Albarracín" },
  calatayud: { ar: "Calatayud" },
  teruel: { ar: "Teruel" },
};
let aboutImgs = [];
// Cada vez que se entra, reparte las 6 imágenes sin repetir. En «¿Dónde se habla?» (tarjeta 2) siempre L'Aínsa o Uesca.
function pickAboutImgs() {
  const where = Math.random() < 0.5 ? "ainsa" : "huesca";
  const rest = shuffle(Object.keys(PLACES).filter(k => k !== where));
  aboutImgs = ABOUT.map((_, k) => (k === 1 ? where : rest.shift()));
}
// Banderas para cambiar el idioma de «Sobre el aragonés». Las traducciones al aragonés están pendientes de revisión.
const FLAG_ES = `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><clipPath id="cES"><circle cx="50" cy="50" r="50"/></clipPath></defs>
<g clip-path="url(#cES)"><rect width="100" height="100" fill="#AA151B"/><rect y="25" width="100" height="50" fill="#F1BF00"/></g></svg>`;

const FLAG_AR = (() => {
  const band = 100 / 9;
  const stripes = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => `<rect y="${(k * band).toFixed(2)}" width="100" height="${(band + 0.3).toFixed(2)}" fill="${k % 2 ? "#DA121A" : "#FCDD09"}"/>`).join("");
  // Escudo: forma española (fondo redondeado), 44 x 54
  const shield = "M29 33 H71 V63 A21 21 0 0 1 29 63 Z";
  const bars = [0, 1, 2, 3, 4, 5, 6, 7, 8].map(k => k % 2 ? `<rect x="${(50 + k * 21 / 9).toFixed(2)}" y="53" width="${(21 / 9).toFixed(2)}" height="32" fill="#DA121A"/>` : "").join("");
  const head = (x, y) => `<circle cx="${x}" cy="${y}" r="2.7" fill="#2B1B12"/><path d="M${x - 2.8} ${y - 0.9}h5.6" stroke="#fff" stroke-width="1.1"/>`;
  return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs>
<clipPath id="cAR"><circle cx="50" cy="50" r="50"/></clipPath><clipPath id="cSh"><path d="${shield}"/></clipPath></defs>
<g clip-path="url(#cAR)">${stripes}
<g clip-path="url(#cSh)">
  <!-- 1: árbol de Sobrarbe (encina con cruz roja) sobre oro -->
  <rect x="29" y="33" width="21" height="20" fill="#F4C430"/>
  <rect x="38.4" y="44" width="3.2" height="7" fill="#6B4423"/>
  <ellipse cx="40" cy="43" rx="6.6" ry="5" fill="#2E7D32"/>
  <path d="M40 34.2v6.6M37.2 36.6h5.6" stroke="#DA121A" stroke-width="1.7"/>
  <!-- 2: cruz de Íñigo Arista (plata) sobre azul, en el cantón -->
  <rect x="50" y="33" width="21" height="20" fill="#1F4E9C"/>
  <path d="M56 35.2v9.6M51.2 40h9.6" stroke="#fff" stroke-width="2.3"/>
  <!-- 3: cruz de San Jorge con cuatro cabezas sobre plata -->
  <rect x="29" y="53" width="21" height="32" fill="#fff"/>
  <path d="M39.5 53v32M29 62.5h21" stroke="#DA121A" stroke-width="3.2"/>
  ${head(33.8, 57.6)}${head(45.2, 57.6)}${head(33.8, 68.4)}${head(45.2, 68.4)}
  <!-- 4: barras de Aragón -->
  <rect x="50" y="53" width="21" height="32" fill="#FCDD09"/>${bars}
  <path d="M50 33v52M29 53h42" stroke="#5C3A00" stroke-width="0.8"/>
</g>
<path d="${shield}" fill="none" stroke="#5C3A00" stroke-width="1.6"/>
<!-- corona real abierta -->
<path d="M31 32 L31 22 L37 26.5 L43.5 17.5 L50 25 L56.5 17.5 L63 26.5 L69 22 L69 32 Z" fill="#E8B80A" stroke="#5C3A00" stroke-width="1.3" stroke-linejoin="round"/>
<circle cx="43.5" cy="17.2" r="1.7" fill="#E8B80A" stroke="#5C3A00" stroke-width=".8"/><circle cx="56.5" cy="17.2" r="1.7" fill="#E8B80A" stroke="#5C3A00" stroke-width=".8"/><circle cx="50" cy="23.6" r="1.5" fill="#E8B80A" stroke="#5C3A00" stroke-width=".8"/>
<circle cx="40" cy="29" r="1.3" fill="#DA121A"/><circle cx="50" cy="29" r="1.3" fill="#1F4E9C"/><circle cx="60" cy="29" r="1.3" fill="#2E7D32"/>
</g></svg>`;
})();
function aboutLang() { return S.aboutLang === "an" ? "an" : "es"; }
function renderAbout(i, keep) {
  if (!keep || !aboutImgs.length) pickAboutImgs();
  window.scrollTo(0, 0);
  const c = ABOUT[i], last = i === ABOUT.length - 1, an = aboutLang() === "an";
  const T = { title: an ? c.title_ar : c.title, text: an ? c.text_ar : c.text, src: an ? c.src_ar : c.src };
  $app.className = "app";
  $app.innerHTML = `<main class="about">
    <div class="about-top"><button class="icon-btn" id="ab-close" aria-label="Cerrar">${ICON.close}</button>
      <div class="dots">${ABOUT.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
      <div class="langs" role="group" aria-label="Idioma">
        <button class="lang" data-lang="es" aria-pressed="${aboutLang() === "es"}" title="Castellano">${FLAG_ES}</button>
        <button class="lang" data-lang="an" aria-pressed="${aboutLang() === "an"}" title="Aragonés">${FLAG_AR}</button>
      </div></div>
    <article class="about-card">
      ${(() => { const k = aboutImgs[i], P = PLACES[k]; return `<div class="about-pic" id="flip" role="button" tabindex="0" aria-label="¿Dónde está Dragolingüe? Toca la imagen para verlo en el mapa">
        <div class="flip-inner">
          <div class="face front"><img src="web/img/${k}.jpg" alt="Dragolingüe de paseo por Aragón"><span class="where">${an ? "¿Án ye Dragolingüe?" : "¿Dónde está Dragolingüe?"} <span aria-hidden="true">↻</span></span></div>
          <div class="face back"><img src="web/img/mapa-${k}.jpg" alt="Mapa de Aragón con una chincheta roja"><div class="sign">${esc(P.ar)}${P.es ? `<small>${esc(P.es)}</small>` : ""}</div></div>
        </div></div>`; })()}
      <h1 lang="${an ? "an" : "es"}">${esc(T.title)}</h1>
      <div class="talk"><div class="mini">${dragon("happy")}</div><p lang="${an ? "an" : "es"}">${esc(T.text)}</p></div>
      ${T.src ? `<p class="src">${esc(T.src)}</p>` : ""}
    </article>
    <div class="about-nav">
      ${i > 0 ? `<button class="big-btn secondary" id="ab-prev">Anterior</button>` : ""}
      <button class="big-btn" id="ab-next">${last ? "¡Aprende aragonés!" : an ? "Siguient" : "Siguiente"}</button>
    </div></main>`;
  $app.querySelector("#ab-close").onclick = () => (S.welcomed ? renderHome() : renderWelcome());
  $app.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => {
    if (aboutLang() === b.dataset.lang) return;
    S.aboutLang = b.dataset.lang; save();
    const flipped = $app.querySelector("#flip").classList.contains("flipped");
    renderAbout(i, true);
    if (flipped) $app.querySelector("#flip").classList.add("flipped");
  });
  const fl = $app.querySelector("#flip");
  const flip = () => fl.classList.toggle("flipped");
  fl.onclick = flip;
  fl.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } };
  const p = $app.querySelector("#ab-prev"); if (p) p.onclick = () => renderAbout(i - 1, true);
  $app.querySelector("#ab-next").onclick = () => {
    if (last) { S.welcomed = true; save(); tab = "learn"; renderHome(); } else renderAbout(i + 1, true);
  };
}

// El contenido se lee de src/content/contenido.json, el mismo archivo que usa la app de Expo.
fetch("src/content/contenido.json", { cache: "no-cache" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { adoptContent(d); if (S.welcomed) renderHome(); else renderWelcome(); })
  .catch(() => { $app.innerHTML = '<p class="locked-note" style="padding-top:40px">No se ha podido leer el contenido de las lecciones. Comprueba la conexión y vuelve a abrir la app.</p>'; });

// Permite instalarla en el móvil y usarla sin conexión.
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
